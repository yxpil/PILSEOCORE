<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PILSEOCORE 本地搜索引擎</title>
<style>
  :root {
    --blue:#4285f4; --red:#ea4335; --yellow:#fbbc05; --green:#34a853;
    --bg:#fff; --text:#202124; --panel:#fff; --line:#e0e0e0; --hover:#f1f3f4;
    --link:#1a0dab; --desc:#4d5156; --gray:#5f6368; --search-bg:#fff; --mark-bg:#feebc8; --foot:#f2f2f2;
  }
  html[data-theme="dark"] {
    --bg:#202124; --text:#e8eaed; --panel:#2d2e31; --line:#3c4043; --hover:#3c4043;
    --link:#8ab4f8; --desc:#bdc1c6; --gray:#9aa0a6; --search-bg:#2d2e31; --mark-bg:#5c4a00; --foot:#171717;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); transition:background .2s; }
  a { text-decoration:none; }
  mark { background:var(--mark-bg); color:inherit; border-radius:2px; padding:0 1px; }

  /* 顶部导航(结果页):左对齐基准线 */
  #topbar { display:none; align-items:center; gap:20px; padding:18px 24px 10px; position:sticky; top:0; background:var(--bg); z-index:50; }
  #topbar .mini-logo { font-size:20px; font-weight:600; letter-spacing:-1px; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:8px; }
  #topbar .searchbox-wrap { flex:1; max-width:620px; position:relative; }
  #topbar .sb { border-radius:24px; border:1px solid var(--line); background:var(--search-bg); padding:11px 20px; font-size:16px; outline:none; width:100%; color:var(--text); padding-right:76px; }
  #topbar .sb:focus, #topbar .sb:hover { box-shadow:0 1px 6px rgba(32,33,36,.28); border-color:transparent; }
  #topbar .sb-btn { position:absolute; right:5px; top:50%; transform:translateY(-50%); border:none; background:var(--blue); color:#fff; border-radius:17px; padding:7px 18px; font-size:13px; cursor:pointer; }
  #topbar .sb-btn:hover { opacity:.9; }
  .top-actions { display:flex; align-items:center; gap:14px; }
  .admin-link { color:var(--gray); font-size:13px; cursor:pointer; white-space:nowrap; }
  .admin-link:hover { color:var(--blue); }
  .theme-btn { color:var(--gray); font-size:13px; cursor:pointer; white-space:nowrap; border:1px solid var(--line); border-radius:16px; padding:5px 14px; background:var(--panel); }
  .theme-btn:hover { border-color:var(--blue); color:var(--blue); }

  /* 语法提示条 */
  #syntaxTip { display:none; color:var(--gray); font-size:12px; padding:2px 24px 0; max-width:680px; }
  #syntaxTip code { background:var(--hover); border-radius:4px; padding:1px 5px; font-size:11px; }

  /* 主页 */
  #home { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; padding:0 16px; }
  #home .big-logo { display:flex; align-items:center; gap:14px; font-size:56px; font-weight:600; letter-spacing:-4px; margin-bottom:32px; user-select:none; }
  #home .sb { border-radius:28px; border:1px solid var(--line); background:var(--search-bg); padding:15px 24px; font-size:18px; outline:none; width:min(560px,90vw); box-shadow:none; color:var(--text); }
  #home .sb:hover, #home .sb:focus { box-shadow:0 1px 6px rgba(32,33,36,.28); }
  #home .btns { display:flex; gap:12px; margin-top:24px; }
  #home .btn { background:var(--foot); border:1px solid var(--foot); border-radius:6px; padding:10px 18px; font-size:14px; color:var(--text); cursor:pointer; }
  #home .btn:hover { border-color:var(--line); box-shadow:0 1px 2px rgba(0,0,0,.1); }
  #home .home-admin { margin-top:40px; }

  /* 联想下拉 */
  #suggest { position:relative; width:min(560px,90vw); }
  #suggest .panel { position:absolute; top:6px; left:0; right:0; background:var(--panel); border-radius:16px; box-shadow:0 4px 20px rgba(32,33,36,.28); overflow:hidden; z-index:10; }
  #suggest .item { padding:10px 22px; font-size:15px; cursor:pointer; display:flex; align-items:center; gap:10px; }
  #suggest .item:hover, #suggest .item.active { background:var(--hover); }
  #suggest .item .q { color:var(--text); }

  /* 结果区:内容居左容器(符合行业惯例,横向扫读) */
  #results { max-width:680px; margin:10px 0 0 24px; padding:0 0 64px; }
  .stat { color:var(--gray); font-size:13px; margin:0 0 14px; }
  .result { margin-bottom:22px; padding:8px 12px; border-radius:10px; margin-left:-12px; }
  .result:hover { background:var(--hover); }
  .result .url { color:var(--green); font-size:13px; margin-bottom:2px; display:flex; align-items:center; gap:6px; word-break:break-all; }
  .result .url .fav { width:16px; height:16px; border-radius:3px; flex-shrink:0; }
  .result .title { font-size:20px; color:var(--link); display:block; }
  .result .title:hover { text-decoration:underline; }
  .result .desc { color:var(--desc); font-size:14px; line-height:1.6; margin-top:4px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .result .desc.expanded { -webkit-line-clamp:unset; }
  .desc-more { font-size:12px; color:var(--blue); cursor:pointer; margin-top:2px; display:inline-block; }
  .result .kw { color:var(--gray); font-size:12px; margin-top:2px; cursor:pointer; user-select:none; }
  .result .kw:hover { color:var(--blue); }
  .result .acts { display:flex; gap:14px; margin-top:5px; opacity:0; transition:opacity .15s; font-size:12px; }
  .result:hover .acts { opacity:1; }
  .result .acts a, .result .acts span { color:var(--gray); cursor:pointer; }
  .result .acts a:hover, .result .acts span:hover { color:var(--blue); }
  .engine-tag { display:inline-block; background:#1a73e8; color:#fff; font-size:11px; border-radius:4px; padding:1px 6px; flex-shrink:0; }
  .ai-box { background:var(--panel); border-radius:12px; padding:16px 20px; margin-bottom:24px; border:1px solid var(--line); }
  .ai-box .ai-label { font-size:12px; color:var(--gray); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .ai-box .ai-text { font-size:14px; line-height:1.7; color:var(--text); white-space:pre-wrap; }
  .ai-box .ai-err { color:var(--red); font-size:13px; margin-top:6px; }

  .empty { color:var(--gray); text-align:center; margin-top:80px; font-size:15px; }
  .pager { display:flex; align-items:center; gap:6px; justify-content:center; margin:30px 0 10px; flex-wrap:wrap; }
  .pg { display:inline-block; min-width:38px; padding:9px 12px; border-radius:10px; font-size:14px; color:var(--blue); cursor:pointer; text-align:center; border:1px solid transparent; user-select:none; }
  .pg:hover { background:var(--hover); }
  .pg.cur { background:var(--blue); color:#fff; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.15); }
  .pg.dim { color:var(--line); cursor:default; }
  .pg.next { border:1px solid var(--line); }
  .pg-jump { display:flex; align-items:center; gap:6px; color:var(--gray); font-size:13px; margin-left:6px; }
  .pg-jump input { width:48px; padding:7px 8px; border:1px solid var(--line); border-radius:8px; font-size:13px; text-align:center; background:var(--panel); color:var(--text); outline:none; }
  .pg-jump input:focus { border-color:var(--blue); }
  .pg-jump .go { color:var(--blue); cursor:pointer; }

  /* 模态框 */
  .modal-mask { display:none; position:fixed; inset:0; background:rgba(32,33,36,.5); z-index:100; }
  .modal { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; border-radius:16px; box-shadow:0 8px 40px rgba(0,0,0,.3); padding:28px 32px; width:min(680px,92vw); max-height:86vh; overflow-y:auto; }
  .modal h2 { font-size:20px; margin-bottom:4px; }
  .modal .sub { color:var(--gray); font-size:13px; margin-bottom:20px; }
  .modal .close { float:right; cursor:pointer; color:var(--gray); font-size:20px; }
  .modal .close:hover { color:#202124; }
  .modal label { display:block; font-size:13px; color:var(--gray); margin:14px 0 6px; }
  .modal input[type=text], .modal input[type=password], .modal input[type=number], .modal textarea {
    width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 14px; font-size:14px; outline:none; font-family:inherit;
  }
  .modal input:focus, .modal textarea:focus { border-color:var(--blue); box-shadow:0 0 0 2px rgba(66,133,244,.15); }
  .modal textarea { min-height:120px; font-family:Consolas,monospace; font-size:13px; resize:vertical; }
  .modal .row { display:flex; gap:12px; }
  .modal .row > div { flex:1; }
  .modal .btn { background:#1a73e8; color:#fff; border:none; border-radius:8px; padding:10px 22px; font-size:14px; cursor:pointer; margin-top:18px; }
  .modal .btn:hover { background:#1765cc; }
  .modal .btn.secondary { background:#f8f9fa; color:#3c4043; border:1px solid var(--line); }
  .modal .btn:disabled { opacity:.5; cursor:not-allowed; }
  .modal .msg { font-size:13px; margin-top:10px; min-height:18px; }
  .modal .msg.ok { color:var(--green); }
  .modal .msg.err { color:var(--red); }
  .modal .msg.warn { color:#b06000; }
  .scan-state { background:#f8f9fa; border:1px solid var(--line); border-radius:8px; padding:12px 16px; font-size:13px; margin-top:12px; display:none; }
  .scan-state b { color:var(--blue); }
  .bar-wrap { background:#f1f3f4; border-radius:8px; height:8px; overflow:hidden; margin-bottom:8px; }
  .bar { background:var(--blue); height:100%; width:0%; transition:width .3s ease; }

  footer { color:var(--gray); font-size:12px; text-align:center; padding:24px; background:var(--foot); margin-top:20px; line-height:1.9; }
  footer .foot-syntax { font-size:12px; }
  footer code { background:var(--hover); border-radius:4px; padding:1px 5px; font-size:11px; }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div id="topbar">
  <div class="mini-logo" onclick="goHome()">
    <svg viewBox="0 0 24 24" width="22" height="22" style="flex-shrink:0"><circle cx="10" cy="10" r="6.5" fill="none" stroke="var(--blue)" stroke-width="2.2"/><line x1="15" y1="15" x2="21" y2="21" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round"/></svg>
    <span style="color:var(--blue)">P</span><span style="color:var(--red)">I</span><span style="color:var(--yellow)">L</span><span style="color:var(--blue)">S</span><span style="color:var(--green)">E</span><span style="color:var(--red)">O</span><span style="color:var(--yellow)">C</span><span style="color:var(--blue)">O</span><span style="color:var(--green)">R</span><span style="color:var(--red)">E</span>
  </div>
  <div class="searchbox-wrap"><input class="sb" id="topq" autocomplete="off" placeholder="搜索本地站点... (支持 site:域名 限定范围)" onkeydown="if(event.key==='Enter')doSearch(this.value)" oninput="debouncedSuggest(this.value)"><button class="sb-btn" onclick="doSearch(document.getElementById('topq').value)">搜索</button></div>
  <div class="top-actions">
    <span class="theme-btn" onclick="toggleTheme()" id="themeBtn">暗色</span>
    <span class="admin-link" onclick="openAdmin()">管理</span>
  </div>
</div>

<!-- 主页 -->
<div id="home">
  <div class="big-logo">
    <svg viewBox="0 0 24 24" width="44" height="44" style="flex-shrink:0"><circle cx="10" cy="10" r="6.5" fill="none" stroke="var(--blue)" stroke-width="2.4"/><line x1="15" y1="15" x2="21" y2="21" stroke="var(--green)" stroke-width="2.6" stroke-linecap="round"/></svg>
    <span style="color:var(--blue)">P</span><span style="color:var(--red)">I</span><span style="color:var(--yellow)">L</span><span style="color:var(--blue)">S</span><span style="color:var(--green)">E</span><span style="color:var(--red)">O</span><span style="color:var(--yellow)">C</span><span style="color:var(--blue)">O</span><span style="color:var(--green)">R</span><span style="color:var(--red)">E</span>
  </div>
  <div id="suggest">
    <input class="sb" id="q" autocomplete="off" placeholder="搜索本地站点..." onkeydown="if(event.key==='Enter')doSearch(this.value)" oninput="debouncedSuggest(this.value)">
    <div class="panel" id="panel" style="display:none"></div>
  </div>
  <div class="btns">
    <button class="btn" onclick="doSearch(document.getElementById('q').value)">搜索</button>
    <button class="btn" onclick="doSearch(document.getElementById('q').value, true)">AI 搜索</button>
  </div>
  <div class="home-admin"><span class="admin-link" onclick="openAdmin()">管理员入口</span></div>
</div>

<!-- 结果 -->
<div id="results" style="display:none"></div>
<footer id="foot" style="display:none">
  <div>PILSEOCORE 本地搜索引擎 · 域名穷举 · 自动建站 · 本地索引</div>
  <div class="foot-syntax">高级语法: <code>site:gfan.com</code> 限定站点 · 本地无结果时自动借用必应/百度/360/搜狗/谷歌/中国搜索(结果缓存到本地)</div>
  <div>© 2026 杨欣云(Yxpil) · PILSEOCORE Project · 保留作者署名</div>
</footer>

<!-- 管理员模态框 -->
<div class="modal-mask" id="adminMask" onclick="if(event.target===this)closeAdmin()">
  <div class="modal">
    <span class="close" onclick="closeAdmin()">x</span>
    <h2>管理员控制台</h2>
    <div class="sub">普通用户仅可搜索;管理员可触发穷举遍历、配置域名后缀与 DNS</div>
    <div id="loginBox">
      <label>管理员账号</label>
      <input type="text" id="adminUser" placeholder="admin_user" onkeydown="if(event.key==='Enter')adminLogin()">
      <label>密码</label>
      <input type="password" id="adminPass" placeholder="admin_pass" onkeydown="if(event.key==='Enter')adminLogin()">
      <div class="msg" id="loginMsg"></div>
      <button class="btn" onclick="adminLogin()">登录</button>
    </div>
    <div id="panelBox" style="display:none">
      <label>穷举遍历(从 1 位穷举到指定位数)</label>
      <div class="row">
        <div><label style="margin-top:0">最大位数</label><input type="number" id="scanMaxLen" value="2" min="1" max="20"></div>
        <div><label style="margin-top:0">并发数</label><input type="number" id="scanWorkers" value="64" min="1" max="512"></div>
      </div>
      <button class="btn" id="scanBtn" onclick="startScan()">开始穷举遍历</button>
      <button class="btn secondary" onclick="rebuildIndex()">重建索引</button>
      <div class="scan-state" id="scanState">
        <div class="bar-wrap"><div class="bar" id="scanBar"></div></div>
        <div id="scanText"></div>
      </div>

      <label>域名后缀列表(空格分隔,按此顺序遍历)</label>
      <textarea id="tldEdit"></textarea>
      <button class="btn secondary" onclick="saveConfig('tld')">保存后缀列表</button>

      <label>DNS 服务器列表(每行一个,随机负载均衡)</label>
      <textarea id="dnsEdit"></textarea>
      <button class="btn secondary" onclick="saveConfig('dns')">保存 DNS 列表</button>

      <label>API / MCP 访问令牌(管理员签发,用于 API 请求与 MCP 启动)</label>
      <div class="row">
        <input type="text" id="tokName" placeholder="令牌名称,如 mcp-server">
        <button class="btn secondary" onclick="issueToken()">签发</button>
      </div>
      <div id="tokList"></div>
      <div id="newTokenBox" style="display:none; margin-top:10px; background:#f8f9fa; border:1px solid var(--line); border-radius:8px; padding:12px 14px;">
        <div style="font-size:12px; color:var(--gray); margin-bottom:6px">新 token(仅显示一次,请立即复制保存)</div>
        <code id="newTokenValue" style="word-break:break-all; font-size:13px; color:#c5221f; user-select:all"></code>
      </div>

      <label>黑名单(重复/雷同内容自动拉黑 + 手动管理)</label>
      <div class="row">
        <input type="text" id="blDomain" placeholder="域名,如 bad.com">
        <button class="btn secondary" onclick="addBlacklist()">拉黑</button>
      </div>
      <div id="blList" style="font-size:12px;color:var(--gray)"></div>
      <div class="msg" id="adminMsg"></div>
    </div>
  </div>
</div>

<script>
var home = document.getElementById('home');
var topbar = document.getElementById('topbar');
var resultsBox = document.getElementById('results');
var foot = document.getElementById('foot');
var suggestTimer = null;
var scanPoll = null;

function goHome() {
  home.style.display = 'flex';
  topbar.style.display = 'none';
  resultsBox.style.display = 'none';
  resultsBox.innerHTML = '';
  foot.style.display = 'none';
  document.getElementById('q').value = '';
  history.pushState({}, '', '/');
}

function doSearch(q, useAi, page, metaPage) {
  if (!q || !q.trim()) return;
  page = page || 1;
  metaPage = metaPage || 1;
  var url = '/api/search?q=' + encodeURIComponent(q.trim()) + '&limit=10&page=' + page + '&meta_page=' + metaPage;
  if (useAi) url += '&ai=1';
  home.style.display = 'none';
  topbar.style.display = 'flex';
  document.getElementById('topq').value = q;
  hidePanel();
  fetch(url).then(function(r){ return r.json(); }).then(function(d){
    render(d, q, page, metaPage);
    history.pushState({}, '', '/search?q=' + encodeURIComponent(q) + '&page=' + page + '&meta_page=' + metaPage);
  }).catch(function(e){
    resultsBox.innerHTML = '<div class="empty">请求失败:' + e + '</div>';
    resultsBox.style.display = 'block';
    foot.style.display = 'block';
  });
}

/* 主题切换(亮/暗,localStorage 记忆) */
function toggleTheme() {
  var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('pilseo_theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '亮色' : '暗色';
}
(function(){
  var t = localStorage.getItem('pilseo_theme');
  if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); }
  var b = document.getElementById('themeBtn');
  if (b) b.textContent = t === 'dark' ? '亮色' : '暗色';
})();

/* 关键词高亮:查询词(去 site: 语法)逐词高亮,先转义再标记 */
function highlight(q, text) {
  var words = (q || '').split(/\s+/).map(function(w){ return w.replace(/^site:/i, ''); }).filter(function(w){ return w.length >= 2 && !/^[a-z0-9.]+\.[a-z]{2,}$/i.test(w); });
  var html = esc(text);
  words.forEach(function(w){
    if (!w) return;
    var re;
    try { re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'); } catch(e) { return; }
    html = html.replace(re, '<mark>$1</mark>');
  });
  return html;
}

/* 复制链接 */
function copyLink(url) {
  var done = function(){ /* 静默成功 */ };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(function(){
      fallbackCopy(url);
    });
  } else { fallbackCopy(url); }
  var act = event && event.target;
  if (act) { var old = act.textContent; act.textContent = '已复制'; setTimeout(function(){ act.textContent = old; }, 1200); }
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

/* 拉黑域名提示(黑名单在管理后台维护) */
function blockDomain(domain) {
  if (confirm('拉黑 ' + domain + '?该域名将从索引中排除(在管理后台黑名单生效)')) {
    var act = event && event.target;
    if (act) { act.textContent = '请到管理后台确认'; setTimeout(function(){ act.textContent = '拉黑'; }, 2000); }
  }
}

function render(d, q, page, metaPage) {
  page = page || 1;
  metaPage = metaPage || 1;
  var html = '';
  var gt = d.total || 0;
  var pages = Math.max(1, d.pages || 1);
  var cur = d.page || page;
  html += '<div class="stat">当前搜索: <b>' + esc(q) + '</b> · ' + (d.ai_summary ? 'AI 摘要已生成 · ' : '') + '找到 ' + gt + ' 组结果 (' + d.time_ms + ' 毫秒)</div>';
  if (d.ai_summary) {
    html += '<div class="ai-box"><div class="ai-label">AI 智能摘要</div><div class="ai-text">' + esc(d.ai_summary) + '</div></div>';
  }
  if (d.ai_error) {
    html += '<div class="ai-box"><div class="ai-label">AI</div><div class="ai-err">' + esc(d.ai_error) + '</div></div>';
  }
  if (!d.results || !d.results.length) {
    html += '<div class="empty">本地索引没有找到与 "' + esc(q) + '" 相关的结果</div>';
  }
  d.results.forEach(function(r, ri){
    html += '<div class="result">';
    html += '<div class="url"><img class="fav" src="/api/favicon/' + encodeURIComponent(r.domain) + '" alt="" onerror="this.style.display=\'none\'">' + esc(r.url) + '</div>';
    html += '<a class="title" href="' + esc(r.url) + '" target="_blank">' + highlight(q, r.title) + '</a>';
    var descText = r.description || '';
    html += '<div class="desc" id="desc' + ri + '">' + highlight(q, descText) + '</div>';
    if (descText.length > 140) html += '<span class="desc-more" onclick="expandDesc(' + ri + ')">展开</span>';
    if (r.fold_count > 1) html += '<div class="kw" onclick="this.style.display=\'none\'" title="点击收起">另有 ' + (r.fold_count - 1) + ' 个相同标题站点(点击收起)</div>';
    if (r.dup_count > 1) html += '<div class="kw" onclick="this.style.display=\'none\'" title="点击收起">另有 ' + (r.dup_count - 1) + ' 个相同内容站点(点击收起)</div>';
    html += '<div class="acts"><a href="' + esc(r.url) + '" target="_blank">打开</a><span onclick="copyLink(\'' + esc(r.url).replace(/'/g, "\\'") + '\')">复制链接</span><span onclick="blockDomain(\'' + esc(r.domain) + '\')">拉黑</span></div>';
    html += '</div>';
  });
  // 聚合搜索结果(本地搜不到 → 借外部搜索引擎,结果已缓存到本地引擎)
  if (d.meta && d.meta.length) {
    var metaLabel = d.meta_cache == 1 ? '聚合搜索(缓存)' : '聚合搜索(联网抓取)';
    var mTotal = d.meta_total || d.meta.length;
    var mPages = d.meta_pages || 1;
    var mCur = d.meta_page || metaPage;
    html += '<div class="stat" style="margin-top:14px">' + metaLabel + ' · ' + (d.meta_ms || 0) + ' 毫秒 · 来自必应/百度/360/搜狗/谷歌/中国搜索 · 共 ' + mTotal + ' 条(第 ' + mCur + '/' + mPages + ' 页)</div>';
    d.meta.forEach(function(m){
      html += '<div class="result">';
      html += '<div class="url"><span class="engine-tag">' + esc(m.engine) + '</span>' + esc(m.url) + '</div>';
      html += '<a class="title" href="' + esc(m.url) + '" target="_blank">' + highlight(q, m.title) + '</a>';
      html += '<div class="desc">' + highlight(q, m.snippet || '') + '</div>';
      html += '<div class="acts"><a href="' + esc(m.url) + '" target="_blank">打开</a><span onclick="copyLink(\'' + esc(m.url).replace(/'/g, "\\'") + '\')">复制链接</span></div>';
      html += '</div>';
    });
    // 聚合结果翻页
    if (mPages > 1) {
      var mq = esc(q).replace(/'/g, "\\'");
      html += '<div class="pager" style="margin:10px 0 0;justify-content:flex-start">';
      if (mCur > 1) html += '<a class="pg next" onclick="doSearch(\'' + mq + '\',false,' + page + ',' + (mCur - 1) + ')">上一页</a>';
      for (var mi = 1; mi <= Math.min(mPages, 5); mi++) {
        html += (mi === mCur) ? '<span class="pg cur">' + mi + '</span>' : '<a class="pg" onclick="doSearch(\'' + mq + '\',false,' + page + ',' + mi + ')">' + mi + '</a>';
      }
      if (mPages > 5) html += '<span class="pg dim">...</span>';
      if (mCur < mPages) html += '<a class="pg next" onclick="doSearch(\'' + mq + '\',false,' + page + ',' + (mCur + 1) + ')">下一页</a>';
      html += '</div>';
    }
  }
  // 分页导航(总显示,支持跳页)
  html += '<div class="pager">';
  if (cur > 1) html += '<a class="pg next" onclick="doSearch(\'' + esc(q).replace(/'/g, "\\'") + '\',false,' + (cur - 1) + ')">上一页</a>';
  var start = Math.max(1, cur - 3), end = Math.min(pages, cur + 3);
  if (start > 1) html += '<span class="pg dim">...</span>';
  for (var i = start; i <= end; i++) {
    html += (i === cur) ? '<span class="pg cur">' + i + '</span>' : '<a class="pg" onclick="doSearch(\'' + esc(q).replace(/'/g, "\\'") + '\',false,' + i + ')">' + i + '</a>';
  }
  if (end < pages) html += '<span class="pg dim">...</span>';
  if (cur < pages) html += '<a class="pg next" onclick="doSearch(\'' + esc(q).replace(/'/g, "\\'") + '\',false,' + (cur + 1) + ')">下一页</a>';
  html += '<span class="pg-jump">共 ' + pages + ' 页 跳至 <input type="number" min="1" max="' + pages + '" id="jumpPage" onkeydown="if(event.key===\'Enter\')jumpToPage(\'' + esc(q).replace(/'/g, "\\'") + '\',' + pages + ')"> <span class="go" onclick="jumpToPage(\'' + esc(q).replace(/'/g, "\\'") + '\',' + pages + ')">go</span></span>';
  html += '</div>';
  resultsBox.innerHTML = html;
  resultsBox.style.display = 'block';
  foot.style.display = 'block';
}

function jumpToPage(q, pages) {
  var n = parseInt(document.getElementById('jumpPage').value, 10);
  if (!n || n < 1) n = 1;
  if (n > pages) n = pages;
  doSearch(q, false, n);
}

/* 展开折叠的长描述 */
function expandDesc(i) {
  var el = document.getElementById('desc' + i);
  if (!el) return;
  el.classList.add('expanded');
  var more = el.nextElementSibling;
  if (more && more.classList && more.classList.contains('desc-more')) more.style.display = 'none';
}

/* 管理员入口隐藏(engine.conf admin_show=0 时前端不显示,仍可通过 /admin 直达) */
function applyAdminVisibility() {
  fetch('/api/status').then(function(r){ return r.json(); }).then(function(s){
    if (s.admin_visible === false) {
      document.querySelectorAll('.admin-link').forEach(function(el){ el.style.display = 'none'; });
    }
  }).catch(function(){});
}
applyAdminVisibility();

function debouncedSuggest(q) {
  clearTimeout(suggestTimer);
  if (!q || !q.trim()) { hidePanel(); return; }
  suggestTimer = setTimeout(function(){ fetchSuggest(q.trim()); }, 120);
}

function fetchSuggest(q) {
  fetch('/api/suggest?q=' + encodeURIComponent(q) + '&limit=8').then(function(r){ return r.json(); }).then(function(d){
    var list = d.suggestions || [];
    if (!list.length) { hidePanel(); return; }
    var panel = document.getElementById('panel');
    panel.innerHTML = '';
    list.forEach(function(s){
      var item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = '<span class="q">' + esc(s) + '</span>';
      item.onclick = function(){ doSearch(s); };
      panel.appendChild(item);
    });
    panel.style.display = 'block';
  }).catch(function(){ hidePanel(); });
}

function hidePanel() { document.getElementById('panel').style.display = 'none'; }
function esc(s) { return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ============ 管理员控制台 ============ */
function getToken() { return localStorage.getItem('pilseo_admin_session') || ''; }
function adminFetch(path, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  if (getToken()) opts.headers['Authorization'] = 'Bearer ' + getToken();
  return fetch(path, opts);
}

function openAdmin() {
  // 管理后台已迁移到独立页面(左右布局面板)
  location.href = '/admin';
}

function closeAdmin() {
  document.getElementById('adminMask').style.display = 'none';
  if (scanPoll) { clearInterval(scanPoll); scanPoll = null; }
}

function adminLogin() {
  var user = document.getElementById('adminUser').value.trim();
  var pass = document.getElementById('adminPass').value;
  // 已登录(有会话 token)且未输入新账号时直接验证会话
  if (!user && !pass && getToken()) { user = '__session__'; }
  if (!user || !pass) {
    if (getToken()) { verifySession(); return; }
    setMsg('loginMsg', '请输入管理员账号和密码', 'err');
    return;
  }
  fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: user, password: pass })
  }).then(function(r){ return r.json().then(function(d){ return {status:r.status, d:d}; }); }).then(function(res){
    if (res.status === 200) {
      localStorage.setItem('pilseo_admin_session', res.d.token);
      enterPanel();
    } else {
      setMsg('loginMsg', '登录失败: ' + (res.d.error || res.status), 'err');
    }
  }).catch(function(e){ setMsg('loginMsg', '请求失败: ' + e, 'err'); });
}

function verifySession() {
  adminFetch('/api/admin/status').then(function(r){
    if (r.status === 200) enterPanel();
    else { localStorage.removeItem('pilseo_admin_session'); setMsg('loginMsg', '会话已过期,请重新登录', 'err'); }
  }).catch(function(){ setMsg('loginMsg', '会话已过期,请重新登录', 'err'); });
}

function enterPanel() {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('panelBox').style.display = 'block';
  setMsg('adminMsg', '管理员已验证', 'ok');
  loadConfigs();
  loadTokens();
  loadBlacklist();
  pollScan();
  scanPoll = setInterval(pollScan, 3000);
}

function setMsg(id, text, cls) {
  var el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg' + (cls ? ' ' + cls : '');
}

function loadConfigs() {
  adminFetch('/api/admin/config').then(function(r){ return r.json(); }).then(function(d){
    document.getElementById('tldEdit').value = d.tld || '';
    document.getElementById('dnsEdit').value = d.dns || '';
  });
}

function saveConfig(kind) {
  var el = document.getElementById(kind === 'tld' ? 'tldEdit' : 'dnsEdit');
  var content = el.value.trim();
  if (!content) { setMsg('adminMsg', '内容不能为空', 'err'); return; }
  adminFetch('/api/admin/config/' + kind, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: content })
  }).then(function(r){ return r.json().then(function(d){ return {status:r.status, d:d}; }); }).then(function(res){
    if (res.status === 200) {
      setMsg('adminMsg', (kind === 'tld' ? '后缀列表' : 'DNS 列表') + '已保存(' + res.d.entries + ' 条),下次穷举生效', 'ok');
    } else {
      setMsg('adminMsg', '保存失败: ' + (res.d.error || res.status), 'err');
    }
  }).catch(function(e){ setMsg('adminMsg', '保存失败: ' + e, 'err'); });
}

/* ---- API/MCP token 管理 ---- */
function loadTokens() {
  adminFetch('/api/admin/tokens').then(function(r){ return r.json(); }).then(function(d){
    var list = d.tokens || [];
    var el = document.getElementById('tokList');
    if (!list.length) { el.innerHTML = '<div style="font-size:12px; color:var(--gray)">尚未签发 token</div>'; return; }
    el.innerHTML = list.map(function(t){
      return '<div style="display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px">' +
        '<b style="flex:1">' + esc(t.name) + '</b>' +
        '<span style="color:var(--gray)">' + esc(t.prefix) + '...</span>' +
        '<span style="color:var(--gray)">' + new Date(t.created * 1000).toLocaleString() + '</span>' +
        '<a style="color:var(--red); cursor:pointer" onclick="revokeToken(\'' + t.id + '\')">撤销</a></div>';
    }).join('');
  }).catch(function(){});
}

function issueToken() {
  var name = document.getElementById('tokName').value.trim();
  if (!name) { setMsg('adminMsg', '请填写 token 用途名称', 'err'); return; }
  adminFetch('/api/admin/tokens', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name })
  }).then(function(r){ return r.json().then(function(d){ return {status:r.status, d:d}; }); }).then(function(res){
    if (res.status === 201) {
      document.getElementById('newTokenBox').style.display = 'block';
      document.getElementById('newTokenValue').textContent = res.d.token;
      setMsg('adminMsg', 'token 已签发: ' + res.d.name, 'ok');
      document.getElementById('tokName').value = '';
      loadTokens();
    } else {
      setMsg('adminMsg', '签发失败: ' + (res.d.error || res.status), 'err');
    }
  }).catch(function(e){ setMsg('adminMsg', '签发失败: ' + e, 'err'); });
}

function revokeToken(id) {
  if (!confirm('确认撤销该 token?')) return;
  adminFetch('/api/admin/tokens/' + id, { method: 'DELETE' }).then(function(r){
    if (r.status === 200) { setMsg('adminMsg', 'token 已撤销', 'ok'); loadTokens(); }
    else setMsg('adminMsg', '撤销失败', 'err');
  });
}

/* ---- 黑名单管理 ---- */
function loadBlacklist() {
  adminFetch('/api/admin/blacklist').then(function(r){ return r.json(); }).then(function(d){
    var list = d.blacklist || [];
    var el = document.getElementById('blList');
    if (!list.length) { el.innerHTML = '黑名单为空(内容雷同/重复的域名会自动拉黑)'; return; }
    el.innerHTML = list.map(function(b){
      var reason = b.reason === 'similar' ? '内容雷同' : (b.reason === 'duplicate' ? '内容重复' : '手动拉黑');
      return '<div style="display:flex; align-items:center; gap:10px; padding:5px 0; border-bottom:1px solid var(--line)">' +
        '<b style="flex:1">' + esc(b.domain) + '</b>' +
        '<span style="color:var(--gray)">' + reason + '</span>' +
        '<a style="color:var(--blue); cursor:pointer" onclick="removeBlacklist(\'' + esc(b.domain) + '\')">解除</a></div>';
    }).join('');
  }).catch(function(){});
}

function addBlacklist() {
  var domain = document.getElementById('blDomain').value.trim();
  if (!domain) { setMsg('adminMsg', '请填写要拉黑的域名', 'err'); return; }
  adminFetch('/api/admin/blacklist', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ domain: domain })
  }).then(function(r){
    if (r.status === 200) { setMsg('adminMsg', '已拉黑 ' + domain, 'ok'); document.getElementById('blDomain').value = ''; loadBlacklist(); }
    else setMsg('adminMsg', '拉黑失败', 'err');
  });
}

function removeBlacklist(domain) {
  if (!confirm('解除拉黑 ' + domain + '?')) return;
  adminFetch('/api/admin/blacklist/' + encodeURIComponent(domain), { method: 'DELETE' }).then(function(r){
    if (r.status === 200) { setMsg('adminMsg', '已解除 ' + domain, 'ok'); loadBlacklist(); }
    else setMsg('adminMsg', '解除失败', 'err');
  });
}

function startScan() {
  var maxLen = parseInt(document.getElementById('scanMaxLen').value, 10) || 2;
  var workers = parseInt(document.getElementById('scanWorkers').value, 10) || 64;
  if (maxLen < 1 || maxLen > 20) { setMsg('adminMsg', '最大位数范围 1-20', 'err'); return; }
  setMsg('adminMsg', '正在启动穷举遍历(位数 ' + maxLen + ',并发 ' + workers + ')...', 'warn');
  adminFetch('/api/admin/scan', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ max_len: maxLen, workers: workers })
  }).then(function(r){ return r.json().then(function(d){ return {status:r.status, d:d}; }); }).then(function(res){
    if (res.status === 202) {
      setMsg('adminMsg', '穷举已启动,后台运行中(完成后自动重建索引)', 'ok');
      pollScan();
      if (!scanPoll) scanPoll = setInterval(pollScan, 3000);
    } else {
      setMsg('adminMsg', '启动失败: ' + (res.d.error || res.status), 'err');
    }
  }).catch(function(e){ setMsg('adminMsg', '启动失败: ' + e, 'err'); });
}

function pollScan() {
  adminFetch('/api/admin/scan-status').then(function(r){ return r.json(); }).then(function(s){
    var el = document.getElementById('scanState');
    var txt = document.getElementById('scanText');
    var bar = document.getElementById('scanBar');
    var btn = document.getElementById('scanBtn');
    el.style.display = 'block';
    var gtStr = s.grand_total || '0';
    var gt = parseFloat(gtStr) || 0;
    var pct = gt > 0 ? Math.min(100, Math.round(s.total / gt * 100)) : 0;
    bar.style.width = pct + '%';
    if (s.running) {
      btn.disabled = true;
      txt.innerHTML = '<b>扫描中...</b> 已处理 ' + s.total + ' / ' + gtStr + ' (' + pct + '%) · 可用=' + s.available + ' · 已注册=' + s.registered + ' · 失败=' + s.errors + ' · 建站=' + s.sites;
    } else {
      btn.disabled = false;
      if (s.finished) {
        bar.style.width = '100%';
        var line = '<b>上次扫描完成</b> 总数=' + s.total + ' · 可用=' + s.available + ' · 已注册=' + s.registered + ' · 失败=' + s.errors + ' · 建站=' + s.sites + ' · 耗时=' + s.elapsed_secs + 's';
        if (s.error) line += '<br>错误: ' + esc(s.error);
        txt.innerHTML = line;
      } else {
        bar.style.width = '0%';
        txt.innerHTML = '暂无扫描记录';
      }
    }
  }).catch(function(){});
}

function rebuildIndex() {
  setMsg('adminMsg', '正在重建索引...', 'warn');
  adminFetch('/api/admin/rebuild', { method: 'POST' }).then(function(r){ return r.json(); }).then(function(d){
    if (d.status === 'ok') setMsg('adminMsg', '索引重建完成,共 ' + d.sites + ' 个站点', 'ok');
    else setMsg('adminMsg', '重建失败: ' + (d.message || d.status), 'err');
  }).catch(function(e){ setMsg('adminMsg', '重建失败: ' + e, 'err'); });
}

(function(){
  var p = location.pathname;
  if (p === '/search') {
    var params = new URLSearchParams(location.search);
    var q = params.get('q');
    var pg = parseInt(params.get('page'), 10) || 1;
    var mp = parseInt(params.get('meta_page'), 10) || 1;
    if (q) doSearch(q, false, pg, mp);
    else goHome();
  }
})();
</script>
