# ============================================================
# PILSEOCORE 引擎配置
# 格式: key = value    (# 开头为注释,空行忽略)
# ============================================================

# 穷举字符集(按此顺序从 1 位开始遍历)
charset = 1234567890abcdefghijklmnopqrstuvwxyz

# 起始位数 / 最大位数(用户规定的位数,穷举到 N 位为止)
# 注意组合爆炸:36^1=36  36^2=1296  36^3=46656  36^4=167万  36^5=6000万
min_len = 1
max_len = 2

# 域名后缀大全文件(空格/换行分隔,严格按文件中的顺序遍历)
tld_file = config/tld.list

# DNS 服务器列表文件(每行一个,多 DNS 并发探测同一域名)
dns_file = config/dns.list

# SEO 关键词文件(每行一个,建站时轮流取用)
keywords_file = config/keywords.txt

# 黑名单文件(每行一个片段,穷举出的域名含该片段则跳过)
block_file = config/back.list

# 并发 worker 线程数(多网站并发 = 同时在建/在探测的域名数)
workers = 64

# 每个域名同时查询的 DNS 数(从大名单随机抽取,分摊负载避免单个 DNS 被限流)
dns_per_domain = 5

# 单个 DNS 查询超时(毫秒)
dns_timeout_ms = 2000

# 探测的 DNS 记录类型(空格分隔,任一类型命中即视为已注册)
qtypes = A AAAA NS

# 输出目录(结果文件 + 生成的网站)
out_dir = out

# 对探测为"可用"的域名自动生成 SEO 网站(true/false)
build_sites = true

# ===== 本地搜索引擎 =====
# 搜索服务端口(Web UI + API)【固定 8896,勿改】
server_port = 8896
# 热点缓存:LRU 容量(条)与 TTL(秒)
hot_cache_size = 1000
hot_cache_ttl = 60
# AI 接入(OpenAI 兼容,http 端点如本地 llama-server/Ollama;https 需代理转发)
ai_enabled = false
ai_endpoint = http://127.0.0.1:11434/v1/chat/completions
ai_model = qwen3:8b
# ai_api_key = 你的key(本地服务留空)

# ===== 管理员控制 =====
# 管理员账号密码:用于登录 Web UI 管理控制台(用户名 + 密码)
admin_user = admin
admin_pass = pilseo_admin_2026

# API/MCP 访问令牌:登录后由管理员在 Web UI 管理面板"签发",
# 存于 data/tokens.json;API 请求头 Authorization: Bearer <token> 或 MCP 启动参数使用
